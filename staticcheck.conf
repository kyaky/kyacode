# First lint tier (#15): staticcheck's default check set — all minus the
# package-comment/naming style rules (ST1000/ST1003/ST1016/ST1020/ST1021/
# ST1022) that would flake a fast-moving tree for prose reasons rather
# than correctness ones.
#
# The tree is finding-free under this tier. Widening it is a deliberate
# act that lands together with all its findings fixed (zero findings on
# merge); a finding that must stay carries a //lint:ignore with its
# reason inline. This tier keeps out exactly the rot the reviews found
# by hand (dead-code islands, swallowed errors) at near-zero cost.
checks = ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]
